name: release-please
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: sudoswedenab/sudo-actions/release-please@main

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: sudoswedenab/sudo-actions/build-push@main
        with:
          aws-region: us-east-1
          image: sudosweden/dockyards-kubevirt
          registry-type: public
          role-to-assume: arn:aws:iam::075899289117:role/GithubActionsDockyardsKubevirtPublic
          tag: ${{ needs.release-please.outputs.tag_name }}
