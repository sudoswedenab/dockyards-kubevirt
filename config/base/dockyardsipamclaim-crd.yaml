apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipamclaims.kubevirt.dockyards.io
spec:
  group: kubevirt.dockyards.io
  names:
    kind: DockyardsIPAMClaim
    listKind: DockyardsIPAMClaimList
    plural: ipamclaims
    singular: ipamclaim
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Address
      type: string
      jsonPath: .spec.address
    - name: Subnet
      type: string
      jsonPath: .spec.subnet
    - name: Status
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - clusterName
            - machineName
            - interface
            - subnet
            - controlPlane
            properties:
              clusterName:
                type: string
              machineName:
                type: string
              interface:
                type: string
              subnet:
                type: string
              controlPlane:
                type: boolean
              address:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
              reason:
                type: string
              message:
                type: string
              observedGeneration:
                type: integer
                format: int64
    subresources:
      status: {}
